<VirtualHost *:80>
    ServerName redcap.local
    ServerAdmin admin@redcap.local
    
    DocumentRoot /var/www/redcap
    
    <Directory /var/www/redcap>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    <Directory /var/www/redcap/public>
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/redcap_error.log
    CustomLog ${APACHE_LOG_DIR}/redcap_access.log combined
    
    # REDCap specific settings
    php_value upload_max_filesize 500M
    php_value post_max_size 500M
    php_value max_execution_time 300
</VirtualHost>
